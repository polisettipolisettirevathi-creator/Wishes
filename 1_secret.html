<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Secret Entry - For Usha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden bg-slate-950">

  <!-- Background subtle blurred photo -->
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1600&q=80" 
         alt="Secret Blurred Photo" 
         class="w-full h-full object-cover filter blur-md brightness-50 scale-105 transition-all duration-1000" id="bg-photo">
  </div>

  <!-- Content Container -->
  <div class="relative z-10 w-full max-w-md p-8 glass-card text-center shadow-2xl rounded-3xl mx-4 transform transition-all duration-500 hover:scale-[1.01]">
    
    <!-- Lock Icon / Avatar -->
    <div class="relative w-28 h-28 mx-auto mb-6 rounded-full photo-container p-1 border-2 border-pink-500/50 glow-effect shadow-xl">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" 
           alt="Usha Photo" 
           class="w-full h-full object-cover rounded-full filter blur-[2px] hover:blur-0 transition-all duration-500"
           data-lightbox data-caption="Usha - My Secret Love ❤️">
      <div class="absolute inset-0 flex items-center justify-center bg-black/30 rounded-full">
        <span class="text-3xl animate-bounce">🔐</span>
      </div>
    </div>

    <h1 class="text-4xl font-bold font-script text-pink-300 glow-text mb-2">Secret Entry</h1>
    <p class="text-pink-100/80 text-sm mb-6">Enter the secret key to unlock your birthday surprise, Usha ❤️</p>

    <!-- Passcode Form -->
    <form id="passcode-form" onsubmit="unlockPage(event)" class="space-y-4">
      <div class="relative">
        <input type="password" id="passcode" placeholder="Enter Passcode (Hint: USHA or 1403)" 
               class="w-full px-5 py-3 rounded-full bg-white/10 border border-pink-400/30 text-white placeholder-pink-200/50 text-center font-medium focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all backdrop-blur-md">
      </div>
      <p id="error-msg" class="text-xs text-red-400 hidden animate-pulse">Incorrect passcode! Try 'USHA' or '1403' ❤️</p>

      <button type="submit" class="w-full nav-btn justify-center mt-2">
        <span>Unlock Secret Love</span>
        <span>💖</span>
      </button>
    </form>

    <div class="mt-6 text-xs text-pink-300/60">
      <p>Created with infinite love for Usha ❤️</p>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function unlockPage(e) {
      e.preventDefault();
      const code = document.getElementById('passcode').value.trim().toUpperCase();
      const errorMsg = document.getElementById('error-msg');
      const bgPhoto = document.getElementById('bg-photo');

      if (code === 'USHA' || code === '1403' || code === 'LOVE' || code.length > 0) {
        bgPhoto.classList.remove('blur-md', 'brightness-50');
        bgPhoto.classList.add('blur-none', 'brightness-90');
        
        localStorage.setItem('usha_unlocked', 'true');
        
        setTimeout(() => {
          window.location.href = '2_welcome.html';
        }, 800);
      } else {
        errorMsg.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
