<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💙 Welcome Wifiy - For Usha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative p-4 py-16">

  <!-- Main Glass Container -->
  <div class="relative z-10 w-full max-w-2xl p-8 glass-card text-center rounded-3xl my-auto animate-float">
    
    <!-- Heart Icon Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-pink-500/20 border border-pink-400/30 text-pink-300 text-xs font-semibold uppercase tracking-wider mb-6">
      <span>💙 Welcome My Dearest Wifiy</span>
    </div>

    <!-- Beautiful Single Photo -->
    <div class="relative w-64 h-80 sm:w-72 sm:h-96 mx-auto mb-8 photo-container glow-effect shadow-2xl rounded-3xl cursor-pointer"
         data-lightbox data-caption="Usha - The Queen of My Heart 💙">
      <img src="images/pic1.jpeg" 
           alt="Beautiful Wifiy Photo" 
           class="w-full h-full object-cover rounded-3xl transition-transform duration-700 hover:scale-110">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-80 rounded-3xl"></div>
      <div class="absolute bottom-4 left-0 right-0 text-center">
        <span class="text-xs bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-white">Tap to expand 💖</span>
      </div>
    </div>

    <!-- Romantic Message -->
    <h1 class="text-4xl sm:text-5xl font-bold font-script text-pink-300 glow-text mb-4">
      Welcome My Beautiful Wifiy ❤️
    </h1>
    
    <p class="text-slate-200 font-serif text-lg leading-relaxed mb-8 max-w-xl mx-auto">
      “Nuvvu Naa Jeevitham Loki Vachina Taruvatha, Prathi Roju Oka Vasantha Kaalam La Undi. 
      Naa Pranam, Naa Wifiy, Naa Usha... Ninnu Chusinappudalla Naa Hrudayam Santhosham Tho Nindipothundi.”
    </p>

    <!-- Navigation -->
    <div class="flex items-center justify-center gap-4 flex-wrap">
      <a href="1_secret.html" class="nav-btn-secondary">← Back</a>
      <a href="3_countdown.html" class="nav-btn">
        <span>Continue to Countdown</span>
        <span>⏳</span>
      </a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
