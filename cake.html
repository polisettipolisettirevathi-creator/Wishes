<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make A Wish 🎂</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="cake-page">

<div class="cake-glow"></div>

<div class="cake-content">

    <p class="eyebrow">ONE LAST THING...</p>

    <h1>
        Make A <span>Wish</span>
    </h1>

    <div class="cake">

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="cake-top"></div>

        <div class="cake-body">
            <div class="icing"></div>
        </div>

        <div class="cake-plate"></div>

    </div>

    <p class="wish-text">
        Close your eyes.<br>
        Make your sweetest wish.
    </p>

    <button class="blow-btn" onclick="blowCandle()">
        BLOW THE CANDLE 🕯️
    </button>

    <div id="wishMessage"></div>

</div>

<script src="script.js"></script>
</body>
</html>
