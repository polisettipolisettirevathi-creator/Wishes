<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Day ✨</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="count-page">

<div class="moon"></div>

<div class="count-content">

    <p class="eyebrow">THE SPECIAL DAY IS HERE</p>

    <h1>
        Your Birthday
        <span>Countdown</span>
    </h1>

    <div class="countdown">

        <div class="time-box">
            <span id="days">00</span>
            <small>DAYS</small>
        </div>

        <div class="time-box">
            <span id="hours">00</span>
            <small>HOURS</small>
        </div>

        <div class="time-box">
            <span id="minutes">00</span>
            <small>MINUTES</small>
        </div>

        <div class="time-box">
            <span id="seconds">00</span>
            <small>SECONDS</small>
        </div>

    </div>

    <p class="count-text">
        Every second brings us closer<br>
        to celebrating <b>you.</b> ❤️
    </p>

    <a href="letter.html" class="next-btn">
        NEXT SURPRISE →
    </a>

</div>

<script src="script.js"></script>
</body>
</html>
